<h2>登录页布局选择</h2>
<p class="subtitle">选择一种整体布局风格，验证码区域会在表单内部</p>

<div class="cards">
  <div class="card" data-choice="split-lr" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">A — 左右分栏 (当前方案)</div>
        <div class="mockup-body" style="display:flex; min-height:180px;">
          <div style="flex:1; background:linear-gradient(135deg,#1e3a5f,#2d5a87); display:flex; align-items:center; justify-content:center; color:white; font-size:14px; text-align:center; padding:16px;">
            <div>
              <div style="font-size:20px; font-weight:bold; margin-bottom:6px;">Tindae UI</div>
              <div style="opacity:0.7; font-size:12px;">企业级管理系统</div>
            </div>
          </div>
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:8px; font-size:12px;">
            <div style="font-weight:bold; font-size:14px;">登录</div>
            <div class="mock-input" style="width:80%;">用户名</div>
            <div class="mock-input" style="width:80%;">密码</div>
            <div style="display:flex; gap:4px; width:80%;">
              <div class="mock-input" style="flex:1;">验证码</div>
              <div style="width:80px; height:32px; background:#e8e8e8; display:flex; align-items:center; justify-content:center; font-size:10px; border-radius:4px;">A x 3 k</div>
            </div>
            <div class="mock-button" style="width:80%;">登录</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 左右分栏</h3>
      <p>品牌展示 + 表单分离，视觉层次丰富。桌面端效果好，移动端品牌区隐藏</p>
    </div>
  </div>

  <div class="card" data-choice="centered" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">B — 居中卡片</div>
        <div class="mockup-body" style="display:flex; align-items:center; justify-content:center; min-height:180px; background:#f5f7fa;">
          <div style="background:white; border-radius:12px; padding:24px; width:260px; box-shadow:0 2px 12px rgba(0,0,0,0.08);">
            <div style="text-align:center; font-weight:bold; font-size:14px; margin-bottom:12px;">登录</div>
            <div style="display:flex; flex-direction:column; gap:8px; font-size:12px;">
              <div class="mock-input">用户名</div>
              <div class="mock-input">密码</div>
              <div style="display:flex; gap:4px;">
                <div class="mock-input" style="flex:1;">验证码</div>
                <div style="width:80px; height:32px; background:#e8e8e8; display:flex; align-items:center; justify-content:center; font-size:10px; border-radius:4px;">K 7 m 2</div>
              </div>
              <div class="mock-button">登录</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 居中卡片</h3>
      <p>简洁聚焦，移动端友好。适合后台系统快速登录的场景</p>
    </div>
  </div>

  <div class="card" data-choice="split-tb" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">C — 上下分区</div>
        <div class="mockup-body" style="min-height:180px;">
          <div style="background:linear-gradient(135deg,#1e3a5f,#2d5a87); height:60px; display:flex; align-items:center; justify-content:center; color:white; font-size:14px;">
            <div style="font-weight:bold;">Tindae UI</div>
          </div>
          <div style="display:flex; align-items:center; justify-content:center; padding:16px;">
            <div style="width:240px; display:flex; flex-direction:column; gap:8px; font-size:12px;">
              <div class="mock-input">用户名</div>
              <div class="mock-input">密码</div>
              <div style="display:flex; gap:4px;">
                <div class="mock-input" style="flex:1;">验证码</div>
                <div style="width:80px; height:32px; background:#e8e8e8; display:flex; align-items:center; justify-content:center; font-size:10px; border-radius:4px;">R 4 n W</div>
              </div>
              <div class="mock-button">登录</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. 上下分区</h3>
      <p>顶部品牌条 + 下方表单。移动端体验好，桌面端略显空旷</p>
    </div>
  </div>
</div>
